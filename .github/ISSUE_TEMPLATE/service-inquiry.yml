name: Service inquiry
description: Request a fixed USDT quote for scraping, automation, monitoring, or a Python utility, payable on the TON network
title: "[Service inquiry] "
labels:
  - service-inquiry
body:
  - type: dropdown
    id: service
    attributes:
      label: Service needed
      options:
        - Custom web scraper
        - Data pipeline
        - Monitoring and alerts
        - Automation tooling
        - Small Python utility
        - Other
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Project goal
      description: Describe the outcome you need. Do not include passwords, API keys, private data, or confidential URLs.
      placeholder: What should be collected, automated, monitored, converted, or generated?
    validations:
      required: true
  - type: textarea
    id: source-output
    attributes:
      label: Public inputs and desired output
      description: Public source URLs, formats, approximate volume, and delivery format.
    validations:
      required: true
  - type: input
    id: acceptance
    attributes:
      label: Acceptance test
      description: State one concrete test that would prove the work is complete.
      placeholder: e.g. The command converts the sample JSON into a CSV with these five columns
    validations:
      required: true
  - type: input
    id: deadline
    attributes:
      label: Desired deadline
      placeholder: e.g. Within two weeks
  - type: input
    id: budget
    attributes:
      label: Budget range in USDT (TON network)
      description: Payment is requested only after the scope and fixed quote are accepted in this issue.
      placeholder: e.g. 10–20 USDT
  - type: textarea
    id: constraints
    attributes:
      label: Constraints or notes
      description: Compliance, hosting, scheduling, or integration requirements. Do not post secrets.
